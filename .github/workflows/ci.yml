name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Cache fetched fonts (Google Fonts network calls are the main source of CI flakiness)
        uses: actions/cache@v4
        with:
          path: ~/.cache/snap-x
          key: snap-x-fonts-${{ runner.os }}
      - run: npm ci
      - run: npm test
      - name: Example designs still check clean
        run: npm run examples:check
      - name: Example images still match a fresh render (visual regression)
        run: npm run examples:diff
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: examples-diff-node${{ matrix.node }}
          path: .examples-diff/
          if-no-files-found: ignore

  packages:
    name: publish dry-run (no manifest warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-packages.mjs

  publish:
    name: publish changed packages to npm
    needs: [test, packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: node scripts/publish-changed.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
