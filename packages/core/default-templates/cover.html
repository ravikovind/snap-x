<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1500">
<title>Cover Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.25);
    --border-accent: rgba(229,56,59,0.35);
    --grid: rgba(255,255,255,0.03);
    --font: 'Inter', sans-serif;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: rgba(0,0,0,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.15);
    --border-accent: rgba(229,56,59,0.30);
    --grid: rgba(0,0,0,0.04);
  }

  html, body {
    width: 1500px;
    height: 500px;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1500px;
    height: 500px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  /* Subtle grid */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Glows */
  .glow-left {
    position: absolute;
    top: -100px; left: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(229,56,59,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .glow-right {
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(229,56,59,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Layout: left + divider + right */
  .layout {
    position: relative;
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 100%;
    padding: 0 80px;
    gap: 0;
    z-index: 1;
  }

  /* Left column */
  .left {
    flex: 0 0 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    padding-right: 60px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .eyebrow-text {
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .project-name {
    color: var(--text);
    font-size: 72px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.03em;
  }

  .domain-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 14px;
  }
  .domain-text { font-weight: 400; }

  /* Vertical divider */
  .divider {
    flex-shrink: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent 0%, var(--border-accent) 30%, var(--border-accent) 70%, transparent 100%);
    margin: 40px 0;
  }

  /* Right column */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 60px;
    gap: 14px;
  }

  .tagline-1 {
    color: var(--text);
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.015em;
  }
  .tagline-2 {
    color: var(--muted);
    font-size: 20px;
    font-weight: 400;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grid-bg"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="layout">
    <!-- Left -->
    <div class="left">
      <div class="eyebrow">
        <div class="eyebrow-dot"></div>
        <span class="eyebrow-text snap-eyebrow">PROJECT</span>
      </div>
      <div class="project-name snap-name">My Project</div>
      <div class="domain-row snap-domain-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="domain-text snap-domain">myproject.com</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Right -->
    <div class="right">
      <div class="tagline-1 snap-tagline-1">Build faster.</div>
      <div class="tagline-2 snap-tagline-2">A short description of what this project does.</div>
    </div>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const get = (k, fallback = '') => p.get(k) || fallback;

  const theme = get('theme', 'dark');
  if (theme === 'light') document.documentElement.dataset.theme = 'light';

  const font = get('font', 'Inter');
  if (font !== 'Inter') {
    const link = document.createElement('link');
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;700;900&display=swap`;
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    document.documentElement.style.setProperty('--font', `'${font}', sans-serif`);
  }

  const set = (sel, val) => {
    const el = document.querySelector(sel);
    if (!el) return;
    if (val) { el.textContent = val; el.style.display = ''; }
    else el.style.display = 'none';
  };

  const title = get('title', 'My Project');
  const description = get('description', '');
  const domain = get('domain', '');

  // Name: adapt font size
  const nameEl = document.querySelector('.snap-name');
  if (nameEl) {
    nameEl.textContent = title;
    const len = title.length;
    nameEl.style.fontSize = len > 20 ? '52px' : len > 14 ? '62px' : '72px';
  }

  // Eyebrow: domain or "PROJECT"
  set('.snap-eyebrow', domain ? domain.toUpperCase() : 'PROJECT');

  // Domain row
  if (domain) {
    set('.snap-domain', domain);
    document.querySelector('.snap-domain-row').style.display = 'flex';
  } else {
    document.querySelector('.snap-domain-row').style.display = 'none';
  }

  // Taglines: split description at natural midpoint
  if (description) {
    const words = description.split(' ');
    const mid = Math.ceil(words.length / 2);
    const line1 = words.slice(0, mid).join(' ');
    const line2 = words.slice(mid).join(' ');
    set('.snap-tagline-1', line1);
    set('.snap-tagline-2', line2 || null);
  } else {
    document.querySelector('.snap-tagline-1').style.display = 'none';
    document.querySelector('.snap-tagline-2').style.display = 'none';
  }
</script>
</body>
</html>
