<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Poster Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.25);
    --border-accent: rgba(229,56,59,0.35);
    --font: 'Inter', sans-serif;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: rgba(0,0,0,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.15);
    --border-accent: rgba(229,56,59,0.30);
  }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Decorative elements */
  .glow-top {
    position: absolute;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 700px;
    background: radial-gradient(ellipse, rgba(229,56,59,0.12) 0%, transparent 65%);
    pointer-events: none;
  }
  .glow-bottom {
    position: absolute;
    bottom: -100px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 500px;
    background: radial-gradient(ellipse, rgba(229,56,59,0.08) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Outer frame */
  .frame {
    position: absolute;
    top: 40px; left: 40px; right: 40px; bottom: 40px;
    border: 1px solid var(--border-accent);
    border-radius: 20px;
    pointer-events: none;
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    top: 40px; left: 40px;
    width: 5px;
    height: calc(100% - 80px);
    background: linear-gradient(to bottom, var(--accent) 0%, var(--accent-muted) 60%, transparent 100%);
    border-radius: 20px 0 0 20px;
  }

  /* Main content */
  .content {
    position: absolute;
    top: 80px; left: 80px; right: 80px; bottom: 80px;
    display: flex;
    flex-direction: column;
  }

  /* Top section */
  .top {
    padding-top: 60px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0;
  }
  .eyebrow-text {
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* Title section — takes up center mass */
  .title-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 0 60px;
    gap: 40px;
  }

  .title {
    color: var(--text);
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -0.035em;
  }

  /* Decorative line */
  .deco-line {
    width: 80px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Bottom third */
  .bottom-section {
    padding-bottom: 40px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 24px;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 60px;
    max-width: 700px;
  }

  /* Footer bar */
  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border-accent);
    padding-top: 32px;
  }
  .footer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .footer-label {
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>
  <div class="frame"></div>
  <div class="accent-bar"></div>

  <div class="content">
    <!-- Top -->
    <div class="top">
      <div class="eyebrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="eyebrow-text snap-eyebrow">snap-x</span>
      </div>
    </div>

    <!-- Title section -->
    <div class="title-section">
      <div class="deco-line"></div>
      <div class="title snap-title">My Project</div>
    </div>

    <!-- Bottom -->
    <div class="bottom-section">
      <div class="subtitle snap-subtitle">A short description of what this project does.</div>
      <div class="footer-bar">
        <div class="footer-brand snap-footer-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span class="snap-footer-domain">myproject.com</span>
        </div>
        <span class="footer-label snap-footer-label">Built with snap-x</span>
      </div>
    </div>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const get = (k, fallback = '') => p.get(k) || fallback;

  const theme = get('theme', 'dark');
  if (theme === 'light') document.documentElement.dataset.theme = 'light';

  const font = get('font', 'Inter');
  if (font !== 'Inter') {
    const link = document.createElement('link');
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;700;900&display=swap`;
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    document.documentElement.style.setProperty('--font', `'${font}', sans-serif`);
  }

  const set = (sel, val) => {
    const el = document.querySelector(sel);
    if (!el) return;
    if (val) { el.textContent = val; el.style.display = ''; }
    else el.style.display = 'none';
  };

  const title = get('title', 'My Project');
  const description = get('description', '');
  const domain = get('domain', '');

  // Eyebrow
  set('.snap-eyebrow', domain || title.toUpperCase());

  // Title — large, dynamic size
  const titleEl = document.querySelector('.snap-title');
  if (titleEl) {
    titleEl.textContent = title;
    const words = title.split(' ');
    const maxWordLen = Math.max(...words.map(w => w.length));
    // Tall format — can go very large
    titleEl.style.fontSize = maxWordLen > 12 ? '88px' : maxWordLen > 8 ? '104px' : '128px';
  }

  // Subtitle
  set('.snap-subtitle', description.length > 150 ? description.slice(0, 150).trimEnd() + '…' : description);

  // Footer
  if (domain) {
    set('.snap-footer-domain', domain);
    document.querySelector('.snap-footer-brand').style.display = 'flex';
  } else {
    document.querySelector('.snap-footer-brand').style.display = 'none';
  }

  set('.snap-footer-label', domain ? 'Share · ' + domain : 'snap-x');
</script>
</body>
</html>
