<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>README Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.25);
    --border-accent: rgba(229,56,59,0.35);
    --surface: #111111;
    --font: 'Inter', sans-serif;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: rgba(0,0,0,0.50);
    --accent: #e5383b;
    --accent-muted: rgba(229,56,59,0.15);
    --border-accent: rgba(229,56,59,0.30);
    --surface: #f5f5f5;
  }

  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
  }

  /* Left accent bar — gradient */
  .accent-bar {
    flex-shrink: 0;
    width: 6px;
    background: linear-gradient(to bottom, var(--accent) 0%, rgba(229,56,59,0.40) 60%, transparent 100%);
  }

  /* Glow top-right */
  .glow-tr {
    position: absolute;
    top: -120px; right: -80px;
    width: 500px; height: 400px;
    background: radial-gradient(circle, rgba(229,56,59,0.10) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Main content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 72px 56px 64px;
    position: relative;
    z-index: 1;
  }

  /* Top: name + domain */
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .project-name {
    color: var(--text);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.0;
  }

  .domain-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-accent);
    border-radius: 8px;
    padding: 7px 14px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 6px;
  }

  /* Middle: description */
  .middle {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 32px 0;
  }

  .desc-block {
    border-left: 3px solid var(--accent);
    padding-left: 24px;
    max-width: 860px;
  }

  .desc-text {
    color: var(--muted);
    font-size: 20px;
    font-weight: 400;
    line-height: 1.55;
  }

  /* Bottom: stack pills */
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stack-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stack-pill {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 5px 14px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  [data-theme="light"] .stack-pill {
    border-color: rgba(0,0,0,0.08);
  }

  .snap-x-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    opacity: 0.7;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="glow-tr"></div>

  <div class="content">
    <!-- Top -->
    <div class="top-row">
      <div class="project-name snap-name">My Project</div>
      <div class="domain-chip snap-domain-chip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="snap-domain">myproject.com</span>
      </div>
    </div>

    <!-- Middle -->
    <div class="middle">
      <div class="desc-block">
        <p class="desc-text snap-desc">A short description of what this project does and why it matters.</p>
      </div>
    </div>

    <!-- Bottom -->
    <div class="bottom-row">
      <div class="stack-pills snap-stack-pills"></div>
      <div class="snap-x-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>snap-x</span>
      </div>
    </div>
  </div>
</div>

<script>
  const p = new URLSearchParams(location.search);
  const get = (k, fallback = '') => p.get(k) || fallback;

  const theme = get('theme', 'dark');
  if (theme === 'light') document.documentElement.dataset.theme = 'light';

  const font = get('font', 'Inter');
  if (font !== 'Inter') {
    const link = document.createElement('link');
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;700;900&display=swap`;
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    document.documentElement.style.setProperty('--font', `'${font}', sans-serif`);
  }

  const set = (sel, val) => {
    const el = document.querySelector(sel);
    if (!el) return;
    if (val) { el.textContent = val; el.style.display = ''; }
    else el.style.display = 'none';
  };

  const title = get('title', 'My Project');
  const description = get('description', '');
  const domain = get('domain', '');
  const stackRaw = get('stack', '');
  const stack = stackRaw ? stackRaw.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6) : [];

  // Name — dynamic size
  const nameEl = document.querySelector('.snap-name');
  if (nameEl) {
    nameEl.textContent = title;
    const len = title.length;
    nameEl.style.fontSize = len > 30 ? '48px' : len > 20 ? '58px' : len > 12 ? '68px' : '80px';
  }

  // Domain chip
  if (domain) {
    set('.snap-domain', domain);
    document.querySelector('.snap-domain-chip').style.display = 'flex';
  } else {
    document.querySelector('.snap-domain-chip').style.display = 'none';
  }

  // Description
  const desc = description.length > 160 ? description.slice(0, 160).trimEnd() + '…' : description;
  set('.snap-desc', desc);

  // Stack pills
  const pillsContainer = document.querySelector('.snap-stack-pills');
  if (stack.length > 0) {
    pillsContainer.innerHTML = stack.map(s =>
      `<span class="stack-pill">${s}</span>`
    ).join('');
  } else {
    pillsContainer.style.display = 'none';
  }
</script>
</body>
</html>
